spring.application.name=Bt8restfullapi-ajax-swagger
server.port=8082

# ===============================
# VIEW RESOLVER CHO JSP
# ===============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# ===============================
# DATABASE CONFIGURATION
# ===============================
# Cấu hình H2 Database mặc định (lưu file tại ./data/webst2, tự động tạo bảng)
spring.datasource.url=jdbc:h2:file:./data/webst2;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MSSQLServer
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Khi muốn chuyển sang SQL Server, hãy bỏ chú thích các dòng dưới và chú thích phần H2 ở trên:
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=webst2;encrypt=false;trustServerCertificate=true;sslProtocol=TLSv1.2;characterEncoding=UTF-8
# spring.datasource.username=sa
# spring.datasource.password=khanhnguyen1602
# spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# ===============================
# FILE UPLOAD & STORAGE
# ===============================
storage.location=uploads
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===============================
# SWAGGER 3 / SPRINGDOC OPENAPI
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
